<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#08070f">

    <title>CINEVERSE - Categoría</title>


    <!-- FUENTE -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="categorias.css?v=1">

</head>


<body>


    <!-- =====================================================
                        FONDO
    ====================================================== -->

    <div class="categoryBackground"></div>

    <div class="categoryGlow categoryGlowOne"></div>

    <div class="categoryGlow categoryGlowTwo"></div>


    <!-- =====================================================
                        CONTENIDO
    ====================================================== -->

    <main class="categoryPage">


        <!-- =================================================
                        BOTÓN REGRESAR
        ================================================== -->

        <a
            href="index.html"
            class="backHome">

            <i class="fa-solid fa-arrow-left"></i>

            <span>
                Volver al inicio
            </span>

        </a>


        <!-- =================================================
                        ENCABEZADO
        ================================================== -->

        <header class="categoryHeader">

            <span
                class="categoryMini">

                CINEVERSE

            </span>


            <h1
                id="categoryTitle">

                Cargando...

            </h1>


            <p
                id="categoryDescription">

                Descubre películas seleccionadas
                para ti.

            </p>

        </header>


        <!-- =================================================
                    PELÍCULAS MÁS VISTAS
        ================================================== -->

        <section
            class="categorySection"
            id="popularSection">


            <div class="sectionHeader">

                <div>

                    <span class="sectionMini">
                        Lo más visto
                    </span>

                    <h2>
                        Películas más vistas
                    </h2>

                </div>

            </div>


            <div
                class="categorySliderWrapper">


                <button
                    id="popularPrev"
                    class="categoryArrow categoryArrowLeft"
                    type="button"
                    aria-label="Películas anteriores">

                    <i class="fa-solid fa-chevron-left"></i>

                </button>


                <div
                    id="popularMovies"
                    class="movieSlider">

                </div>


                <button
                    id="popularNext"
                    class="categoryArrow categoryArrowRight"
                    type="button"
                    aria-label="Películas siguientes">

                    <i class="fa-solid fa-chevron-right"></i>

                </button>


            </div>

        </section>


        <!-- =================================================
                    TODAS LAS PELÍCULAS
        ================================================== -->

        <section
            class="categorySection"
            id="allSection">


            <div class="sectionHeader">

                <div>

                    <span class="sectionMini">
                        Catálogo
                    </span>

                    <h2>
                        Todas las películas
                    </h2>

                </div>


                <span
                    id="movieCount"
                    class="movieCount">

                    0 películas

                </span>

            </div>


            <div
                id="allMovies"
                class="moviesGrid">

            </div>


        </section>


        <!-- =================================================
                    ESTADO VACÍO
        ================================================== -->

        <section
            id="emptyState"
            class="emptyState"
            hidden>


            <div class="emptyIcon">

                <i class="fa-solid fa-film"></i>

            </div>


            <h2>
                Aún no hay películas
            </h2>


            <p id="emptyText">

                Todavía no hay películas en esta categoría.

            </p>


        </section>


    </main>


    <!-- =====================================================
                        TEMPLATE
    ====================================================== -->

    <template id="movieCardTemplate">


        <article class="movieCard">


            <div class="moviePoster">


                <img
                    class="poster"
                    src=""
                    alt="">


                <div class="movieOverlay">


                    <button
                        class="playMovie"
                        type="button"
                        aria-label="Ver película">

                        <i class="fa-solid fa-play"></i>

                    </button>


                </div>


            </div>


            <div class="movieInfo">


                <h3 class="movieTitle">
                    Título
                </h3>


                <div class="movieMeta">


                    <span class="movieYear">
                        2026
                    </span>


                    <span class="movieRating">
                        ⭐ 0.0
                    </span>


                </div>


            </div>


        </article>


    </template>


    <!-- =====================================================
                        LOADING
    ====================================================== -->

    <div
        id="loadingScreen"
        class="loadingScreen">


        <div class="loadingContent">


            <div class="loadingSpinner"></div>


            <p>
                Cargando CINEVERSE...
            </p>


        </div>


    </div>


    <!-- =====================================================
                        TOAST
    ====================================================== -->

    <div
        id="cineverseToast"
        class="cineverseToast">

    </div>


    <!-- =====================================================
                        JAVASCRIPT
    ====================================================== -->

    <script
        src="categorias.js?v=1">
    </script>


</body>

</html>
