<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lumen Play</title>

<link rel="stylesheet" href="css/style.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

</head>

<body>

<!--================ NAVBAR ================-->

<header class="navbar">

<div class="logo">

<i class="fa-solid fa-clapperboard"></i>

<h1>Lumen <span>Play</span></h1>

</div>

<nav>

<a href="#">Inicio</a>

<a href="#">Películas</a>

<a href="#">Series</a>

<a href="#">Favoritos</a>

<a href="#">Mi Lista</a>

</nav>

<div class="buscador">

<input
type="text"
id="buscar"
placeholder="Buscar video...">

<i class="fa-solid fa-magnifying-glass"></i>

</div>

</header>

<!--================ BANNER ================-->

<section class="banner">

<div class="banner-info">

<h2 id="bannerTitulo">

Bienvenido a Lumen Play

</h2>

<p id="bannerDescripcion">

Tu plataforma multimedia.

</p>

<div class="bannerBotones">

<button id="btnVer">

<i class="fa-solid fa-play"></i>

Ver Ahora

</button>

<button id="btnInfo">

<i class="fa-solid fa-circle-info"></i>

Más Información

</button>

</div>

</div>

</section>

<!--================ CATEGORIAS ================-->

<section class="contenedor">

<h2>

🔥 Tendencias

</h2>

<div id="contenedorVideos" class="gridVideos">

</div>

</section>

<!--================ MODAL ================-->

<div id="modal" class="modal">

<div class="modalContenido">

<span id="cerrar">

&times;

</span>

<div id="reproductor">

</div>

<h2 id="tituloVideo"></h2>

<p id="descripcionVideo"></p>

</div>

</div>

<script src="js/app.js"></script>

</body>

</html>
