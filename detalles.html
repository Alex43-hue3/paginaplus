
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CINEVERSE</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
CINEVERSE
</div>


<a href="index.html" class="volver">
← Volver
</a>


</header>




<div id="detalle">


</div>





<script src="peliculas.js"></script>


<script>


let id = localStorage.getItem("pelicula");


let pelicula = peliculas[id];



document.getElementById("detalle").innerHTML = `


<section class="detalle">


<div class="fondo"
style="
background-image:url(${pelicula.imagen})
">
</div>




<div class="contenido-detalle">



<img 
class="poster-detalle"
src="${pelicula.imagen}"
>




<div class="info-detalle">


<h1>
${pelicula.titulo}
</h1>



<div class="datos">

<span>
⭐ ${pelicula.rating}/10
</span>


<span>
📅 ${pelicula.año}
</span>


<span>
🎬 ${pelicula.genero}
</span>


<span>
⏱ ${pelicula.duracion}
</span>

</div>



<p>
${pelicula.descripcion}
</p>



<p>
<b>Director:</b>
${pelicula.director}
</p>



<p>
<b>Reparto:</b>
${pelicula.reparto}
</p>



<button>
▶ Ver trailer
</button>



<button class="favorito">
❤ Favorito
</button>



</div>


</div>


</section>


`;



</script>



</body>
</html>
