
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CINEVERSE - Detalles</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
CINEVERSE
</div>


<a href="index.html" class="volver">
← Volver
</a>


</header>



<div id="detalle"></div>




<script src="peliculas.js"></script>


<script>


// Obtener ID desde la URL

const parametros = new URLSearchParams(
    window.location.search
);


const id = parametros.get("id");


// Buscar película

const pelicula = peliculas[id];





if(pelicula){



document.getElementById("detalle").innerHTML = `



<section class="detalle-pelicula">



<div class="fondo-pelicula"

style="background-image:url('${pelicula.imagen}')">

</div>





<div class="detalle-contenido">



<img 
class="poster"
src="${pelicula.imagen}"
alt="${pelicula.titulo}"
>





<div class="informacion">



<h1>

${pelicula.titulo}

</h1>





<div class="etiquetas">



<span>
⭐ ${pelicula.rating || "8.5"}
</span>



<span>
📅 ${pelicula.año}
</span>



<span>
🎬 ${pelicula.genero}
</span>



<span>
⏱ ${pelicula.duracion || "2h"}
</span>



</div>





<p class="descripcion">

${pelicula.descripcion}

</p>





<p>

<b>Director:</b>

${pelicula.director || "No disponible"}

</p>





<p>

<b>Reparto:</b>

${pelicula.reparto || "No disponible"}

</p>





<div class="botones">


<button class="ver">

▶ Ver trailer

</button>



<button class="fav">

❤ Favorito

</button>



</div>



</div>





</div>



</section>



`;



}else{


document.getElementById("detalle").innerHTML = `

<section>

<h1>
Película no encontrada
</h1>

<br>

<a href="index.html" class="volver">
Regresar
</a>

</section>

`;

}



</script>



</body>

</html>
