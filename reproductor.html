<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>CINEVERSE | Película</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="player.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body class="playerPage">


<!-- =====================================================
                    FONDO
===================================================== -->

<div
    class="playerBackground"
    id="playerBackground">
</div>


<div class="playerPageOverlay"></div>


<!-- =====================================================
                CONTENIDO PRINCIPAL
===================================================== -->

<main class="moviePage">


    <!-- =================================================
                    PARTE SUPERIOR
    ================================================== -->

    <div class="movieTopBar">

        <button
            class="topIconButton"
            id="btnBack"
            type="button"
            aria-label="Regresar">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <div class="topRightButtons">

            <button
                class="topIconButton"
                id="btnShareTop"
                type="button"
                aria-label="Compartir">

                <i class="fa-solid fa-share-nodes"></i>

            </button>


            <button
                class="topIconButton"
                id="btnCast"
                type="button"
                aria-label="Transmitir">

                <i class="fa-solid fa-tv"></i>

            </button>

        </div>

    </div>



    <!-- =================================================
                    PORTADA
    ================================================== -->

    <section class="movieHero">

        <div class="posterWrapper">

            <img
                id="moviePoster"
                class="moviePosterMain"
                src=""
                alt="">

        </div>

    </section>



    <!-- =================================================
                INFORMACIÓN DE LA PELÍCULA
    ================================================== -->

    <section class="movieDetails">


        <!-- BADGES -->

        <div class="movieBadges">

            <span id="movieClasificacion">
                A
            </span>

            <span id="movieQuality">
                HD
            </span>

            <span id="movieSubs">
                CC
            </span>

            <span id="movieAudio">
                AD
            </span>

        </div>


        <!-- TÍTULO -->

        <h1
            id="movieTitle"
            class="movieTitle">

            Cargando película...

        </h1>


        <!-- INFORMACIÓN CORTA -->

        <div class="movieMeta">

            <span id="movieYear">
                2026
            </span>

            <span class="metaSeparator">
                •
            </span>

            <span id="movieDuration">
                Película
            </span>

            <span class="metaSeparator">
                •
            </span>

            <span id="movieGenre">
                Género
            </span>

        </div>


        <!-- BOTÓN PRINCIPAL -->

        <div class="mainAction">

            <button
                id="btnReproducir"
                class="btnWatch"
                type="button">

                <i class="fa-solid fa-play"></i>

                Ver ahora

            </button>

        </div>


        <!-- BOTONES SECUNDARIOS -->

        <div class="secondaryActions">

            <button
                id="btnTrailer"
                class="secondaryButton"
                type="button">

                <i class="fa-solid fa-film"></i>

                Ver tráiler

            </button>


            <button
                id="btnFavorito"
                class="secondaryButton"
                type="button">

                <i class="fa-regular fa-heart"></i>

                Mi lista

            </button>

        </div>


        <!-- DESCRIPCIÓN -->

        <p
            id="movieDescription"
            class="movieDescription">

            La información de la película aparecerá aquí.

        </p>


        <!-- INFORMACIÓN EXTRA -->

        <div class="movieExtraInfo">

            <div>

                <small>
                    Director
                </small>

                <strong id="movieDirector">
                    No disponible
                </strong>

            </div>


            <div>

                <small>
                    Idioma
                </small>

                <strong id="movieIdioma">
                    Español
                </strong>

            </div>


            <div>

                <small>
                    Subtítulos
                </small>

                <strong id="movieSubsInfo">
                    No disponible
                </strong>

            </div>


            <div>

                <small>
                    País
                </small>

                <strong id="moviePais">
                    No disponible
                </strong>

            </div>

        </div>

    </section>



    <!-- =================================================
                PELÍCULAS RELACIONADAS
    ================================================== -->

    <section class="relatedSection">

        <div class="relatedHeader">

            <div>

                <span>
                    RECOMENDACIONES
                </span>

                <h2>
                    También te puede gustar
                </h2>

            </div>

        </div>


        <div
            class="relatedWrapper">

            <button
                id="relatedPrev"
                class="relatedArrow relatedArrowLeft"
                type="button">

                <i class="fa-solid fa-chevron-left"></i>

            </button>


            <div
                id="relatedSlider"
                class="relatedSlider">

            </div>


            <button
                id="relatedNext"
                class="relatedArrow relatedArrowRight"
                type="button">

                <i class="fa-solid fa-chevron-right"></i>

            </button>

        </div>

    </section>

</main>



<!-- =====================================================
            REPRODUCTOR A PANTALLA COMPLETA
===================================================== -->

<div
    id="videoOverlay"
    class="videoOverlay">


    <div class="videoTopControls">

        <button
            id="btnClosePlayer"
            class="videoIconButton"
            type="button"
            aria-label="Cerrar reproductor">

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div class="videoTopRight">

            <button
                id="btnVideoShare"
                class="videoIconButton"
                type="button">

                <i class="fa-solid fa-share-nodes"></i>

            </button>


            <button
                id="btnVideoCast"
                class="videoIconButton"
                type="button">

                <i class="fa-solid fa-tv"></i>

            </button>

        </div>

    </div>


    <!-- =================================================
                    VIDEO
    ================================================== -->

    <div
        id="videoContainer"
        class="videoContainer">


        <!-- YOUTUBE -->

        <div
            id="youtubeContainer"
            class="playerSource youtubeSource">

            <iframe
                id="youtubePlayer"
                src=""
                title="CINEVERSE"
                frameborder="0"
                allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                allowfullscreen>
            </iframe>

        </div>


        <!-- MP4 -->

        <div
            id="mp4Container"
            class="playerSource mp4Source">

            <video
                id="videoPlayer"
                playsinline
                preload="metadata">

                Tu navegador no puede reproducir este vídeo.

            </video>


            <div
                id="cineverseControls"
                class="cineverseControls">


                <button
                    id="btnPlay"
                    class="controlButton"
                    type="button">

                    <i class="fa-solid fa-play"></i>

                </button>


                <button
                    id="btnBack10"
                    class="controlButton"
                    type="button">

                    <i class="fa-solid fa-rotate-left"></i>

                    <span>
                        10
                    </span>

                </button>


                <input
                    id="progressBar"
                    class="progressBar"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1">


                <span
                    id="timeDisplay"
                    class="timeDisplay">

                    0:00 / 0:00

                </span>


                <button
                    id="btnForward10"
                    class="controlButton"
                    type="button">

                    <span>
                        10
                    </span>

                    <i class="fa-solid fa-rotate-right"></i>

                </button>


                <button
                    id="btnMute"
                    class="controlButton"
                    type="button">

                    <i class="fa-solid fa-volume-high"></i>

                </button>


                <input
                    id="volumeBar"
                    class="volumeBar"
                    type="range"
                    min="0"
                    max="1"
                    value="1"
                    step="0.05">


                <button
                    id="btnFullscreen"
                    class="controlButton"
                    type="button">

                    <i class="fa-solid fa-expand"></i>

                </button>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
                    CARGANDO
===================================================== -->

<div
    id="loadingScreen"
    class="loadingScreen">

    <div class="loadingContent">

        <div class="loadingSpinner"></div>

        <h3>
            Cargando...
        </h3>

        <p>
            Preparando la película
        </p>

    </div>

</div>



<script src="reproductor.js?v=20"></script>

</body>

</html>
