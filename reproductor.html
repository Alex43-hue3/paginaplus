<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>CINEVERSE | Película</title>

    <!-- ESTILOS PRINCIPALES -->
    <link rel="stylesheet" href="style.css">

    <!-- ESTILOS DEL REPRODUCTOR -->
    <link rel="stylesheet" href="player.css">

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body class="cineversePlayerPage">


<!-- =====================================================
                    FONDO
===================================================== -->

<div
    id="playerBackground"
    class="playerBackground">
</div>

<div class="playerBackgroundOverlay"></div>


<!-- =====================================================
                    CONTENIDO
===================================================== -->

<main class="moviePage">


    <!-- =================================================
                    BARRA SUPERIOR
    ================================================== -->

    <div class="movieTopBar">

        <!-- REGRESAR -->

        <button
            id="btnRegresar"
            class="movieTopButton"
            type="button"
            aria-label="Regresar">

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <!-- DERECHA -->

        <div class="movieTopActions">


            <!-- COMPARTIR -->

            <button
                id="btnCompartir"
                class="movieTopButton"
                type="button"
                aria-label="Compartir">

                <i class="fa-solid fa-share-nodes"></i>

                <span>Compartir</span>

            </button>


            <!-- VER EN TV -->

            <button
                id="btnTransmitir"
                class="movieTopButton"
                type="button"
                aria-label="Ver en TV">

                <i class="fa-solid fa-tv"></i>

                <span>Ver en TV</span>

            </button>

        </div>

    </div>



    <!-- =================================================
                    PORTADA / HERO
    ================================================== -->

    <section class="movieHero">


        <!-- PORTADA -->

        <div class="moviePosterArea">

            <div class="moviePosterFrame">

                <img
                    id="moviePoster"
                    class="moviePosterImage"
                    src=""
                    alt="Portada de la película">

                <div class="moviePosterGradient"></div>


                <!-- BOTÓN PLAY SOBRE PORTADA -->

                <button
                    id="posterPlayButton"
                    class="posterPlayButton"
                    type="button"
                    aria-label="Reproducir película">

                    <i class="fa-solid fa-play"></i>

                </button>

            </div>

        </div>



        <!-- =================================================
                    INFORMACIÓN PRINCIPAL
        ================================================== -->

        <div class="movieMainInfo">


            <!-- ETIQUETAS -->

            <div
                id="movieBadges"
                class="movieBadges">


                <span
                    id="movieClasificacion"
                    class="movieBadge">

                    A

                </span>


                <span
                    id="movieQuality"
                    class="movieBadge">

                    HD

                </span>


                <span
                    id="movieSubBadge"
                    class="movieBadge">

                    CC

                </span>


                <span
                    id="movieDuration"
                    class="movieBadge
